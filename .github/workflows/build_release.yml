name: Build & Release Flutter Web + Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Run FastAPI pytest suite
        run: pytest backend/tests/test_api.py

  build-flutter-web-and-apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.PROD_API_BASE_URL || 'https://api.antariksh-watch.example.com/api/v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Fetch Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze

      - name: Build Flutter Web (Release)
        working-directory: flutter_app
        run: flutter build web --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Build Android Release APK
        working-directory: flutter_app
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload Flutter Web Bundle
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-release
          path: flutter_app/build/web

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
