name: Build & Release Flutter Web + Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: Test your Python Backend
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python libraries
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/test_api.py

  # JOB 2: Build Flutter Website & Android APK
  build-flutter-web-and-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Setup Java (Needed for Android APK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (Updated to match your code)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Check Dart code for errors
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Build Website (Flutter Web)
        working-directory: flutter_app
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          API_URL="${PROD_API_BASE_URL:-https://example.com}"
          flutter build web --release --dart-define=API_BASE_URL="$API_URL"

      - name: Build Android App (APK)
        working-directory: flutter_app
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          API_URL="${PROD_API_BASE_URL:-https://example.com}"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Save Website files
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-release
          path: flutter_app/build/web

      - name: Save Android APK file
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release (only on version tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
